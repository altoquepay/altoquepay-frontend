<app-auth-layout>
  <h2>Cambiar contraseña</h2>
  @if (auth.mustChangePassword()) {
    <div class="alert warn">Debes cambiar tu contraseña antes de continuar.</div>
  }
  <app-error [message]="error()" />
  <form class="form" (ngSubmit)="submit()" #f="ngForm">
    <label class="field">Contraseña actual
      <span class="input-icon"><app-icon name="lock" [size]="18" /><input name="current" type="password" [(ngModel)]="current" required autocomplete="current-password" placeholder="••••••••" /></span>
    </label>
    <label class="field">Contraseña nueva <small>8 a 128 caracteres, distinta de la actual</small>
      <span class="input-icon"><app-icon name="lock" [size]="18" /><input name="p1" type="password" [(ngModel)]="p1" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="••••••••" /></span>
    </label>
    <label class="field">Repite la contraseña nueva
      <span class="input-icon"><app-icon name="lock" [size]="18" /><input name="p2" type="password" [(ngModel)]="p2" required autocomplete="new-password" placeholder="••••••••" /></span>
    </label>
    <button class="btn block lg" [disabled]="loading() || f.invalid">Guardar</button>
  </form>
  <div class="auth-foot">
    @if (!auth.mustChangePassword()) {
      <a href="" (click)="$event.preventDefault(); location.back()">Volver</a>
    }
    <a href="" (click)="$event.preventDefault(); auth.logout()">Cerrar sesión</a>
  </div>
</app-auth-layout>
