<app-auth-layout>
  <h2>Olvidé mi contraseña</h2>
  <p class="lead">Para administradores. Los clientes recuperan su acceso con un código de su bodega.</p>
  @if (sent()) {
    <div class="alert success">Si el email existe, te enviamos un link para restablecer tu contraseña. Vence en 30 minutos.</div>
  } @else {
    <app-error [message]="error()" />
    <form class="form" (ngSubmit)="submit()" #f="ngForm">
      <label class="field">Email
        <span class="input-icon"><app-icon name="mail" [size]="18" /><input name="email" type="email" [(ngModel)]="email" required email autocomplete="email" placeholder="tu@correo.com" /></span>
      </label>
      <button class="btn block lg" [disabled]="loading() || f.invalid">Enviar link</button>
    </form>
  }
  <div class="auth-foot">
    <a routerLink="/login">Volver al inicio de sesión</a>
    <a routerLink="/activate">Soy cliente</a>
  </div>
</app-auth-layout>
