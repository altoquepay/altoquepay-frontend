<app-auth-layout>
  <h2>Nueva contraseña</h2>
  @if (done()) {
    <div class="alert success">Tu contraseña se actualizó. Ya puedes iniciar sesión.</div>
    <a class="btn block lg" routerLink="/login">Ir a iniciar sesión</a>
  } @else if (!token) {
    <div class="alert error">El link no tiene token. Pide uno nuevo.</div>
    <a class="btn block lg" routerLink="/forgot-password">Pedir un link nuevo</a>
  } @else {
    <app-error [message]="error()" />
    <form class="form" (ngSubmit)="submit()" #f="ngForm">
      <label class="field">Contraseña nueva <small>8 a 128 caracteres</small>
        <span class="input-icon"><app-icon name="lock" [size]="18" /><input name="p1" type="password" [(ngModel)]="p1" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="••••••••" /></span>
      </label>
      <label class="field">Repite la contraseña
        <span class="input-icon"><app-icon name="lock" [size]="18" /><input name="p2" type="password" [(ngModel)]="p2" required autocomplete="new-password" placeholder="••••••••" /></span>
      </label>
      <button class="btn block lg" [disabled]="loading() || f.invalid">Guardar contraseña</button>
    </form>
    @if (expired()) {
      <div class="auth-foot"><a routerLink="/forgot-password">Pedir un link nuevo</a></div>
    }
  }
</app-auth-layout>
