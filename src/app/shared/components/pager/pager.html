@if (total() > 0) {
  <nav class="pager" aria-label="Paginación">
    <span>Mostrando {{ shown() }} de {{ total() }} {{ noun() }}</span>
    <div class="pages">
      <button type="button" class="page" [disabled]="page() <= 1" (click)="pageChange.emit(page() - 1)" aria-label="Página anterior">
        <app-icon name="chevron-left" [size]="16" />
      </button>
      @for (n of numbers(); track n) {
        <button type="button" class="page" [class.current]="n === page()" [attr.aria-current]="n === page() ? 'page' : null"
                (click)="pageChange.emit(n)">{{ n }}</button>
      }
      <button type="button" class="page" [disabled]="page() >= pages()" (click)="pageChange.emit(page() + 1)" aria-label="Página siguiente">
        <app-icon name="chevron-right" [size]="16" />
      </button>
    </div>
  </nav>
}
