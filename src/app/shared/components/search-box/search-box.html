<span class="input-icon">
  <app-icon name="search" [size]="18" />
  <input type="search" [value]="value()" [placeholder]="placeholder()" [attr.aria-label]="label()" maxlength="100"
         (input)="type($any($event.target).value)" (keydown.enter)="$event.preventDefault(); now()" />
  @if (value()) {
    <button type="button" class="clear" aria-label="Limpiar búsqueda" (click)="clear()"><app-icon name="x" [size]="16" /></button>
  }
</span>
